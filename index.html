    <!-- ✅ Formspree bridge: engancha el formulario de React y lo envía a Formspree -->
    <script>
      (function () {
        const FORMSPREE_ENDPOINT = "https://formspree.io/f/mzdzwqww";

        function attachFormspreeHandler(form) {
          if (!form || form.dataset.formspreeBound === "1") return;

          form.dataset.formspreeBound = "1";

          form.addEventListener("submit", async function (e) {
            e.preventDefault();

            // Captura datos del formulario (aunque no tengan name)
            const fd = new FormData();

            const nameInput = form.querySelector('input[type="text"]');
            const emailInput = form.querySelector('input[type="email"]');
            const telInput = form.querySelector('input[type="tel"]');
            const messageArea = form.querySelector('textarea');

            const name = nameInput ? nameInput.value.trim() : "";
            const email = emailInput ? emailInput.value.trim() : "";
            const phone = telInput ? telInput.value.trim() : "";
            const message = messageArea ? messageArea.value.trim() : "";

            // Estos "name" sí los entiende Formspree
            fd.append("name", name);
            fd.append("email", email);
            fd.append("phone", phone);
            fd.append("message", message);

            // Opcionales útiles
            fd.append("_subject", "Nuevo contacto - Educa Dog");
            if (email) fd.append("_replyto", email);

            // UX: deshabilitar botón mientras envía
            const submitBtn = form.querySelector('button[type="submit"]');
            const oldBtnText = submitBtn ? submitBtn.textContent : "";
            if (submitBtn) {
              submitBtn.disabled = true;
              submitBtn.textContent = "Enviando...";
            }

            try {
              const resp = await fetch(FORMSPREE_ENDPOINT, {
                method: "POST",
                body: fd,
                headers: { "Accept": "application/json" }
              });

              if (resp.ok) {
                form.reset();
                alert("✅ Enviado correctamente. Si no te llega el email, lo verificamos en Formspree (Envíos / Notificaciones).");
              } else {
                let data = null;
                try { data = await resp.json(); } catch (_) {}
                console.error("Formspree error:", data);
                alert("❌ No se pudo enviar. Revisa el panel de Formspree (Envíos/Spam) y que el endpoint sea correcto.");
              }
            } catch (err) {
              console.error(err);
              alert("❌ No se pudo enviar (bloqueo, red o CORS). Prueba en una ventana privada y revisamos.");
            } finally {
              if (submitBtn) {
                submitBtn.disabled = false;
                submitBtn.textContent = oldBtnText || "Enviar Mensaje";
              }
            }
          });
        }

        function findAndBind() {
          // Tu formulario está en la sección #contact
          const form = document.querySelector("#contact form");
          if (form) attachFormspreeHandler(form);
        }

        // 1) intento inicial
        document.addEventListener("DOMContentLoaded", function () {
          findAndBind();

          // 2) React pinta después: vigilamos el DOM
          const obs = new MutationObserver(function () {
            findAndBind();
          });
          obs.observe(document.documentElement, { childList: true, subtree: true });
        });
      })();
    </script>
